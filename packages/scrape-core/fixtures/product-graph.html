<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Graph Product</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Example Shop"
          },
          {
            "@type": ["Product", "Thing"],
            "name": "Graph Headphones",
            "offers": {
              "@type": "Offer",
              "price": "149.00",
              "priceCurrency": "GBP"
            }
          }
        ]
      }
    </script>
  </head>
  <body></body>
</html>
